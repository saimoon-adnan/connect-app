name: Build CONNECT Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify required Supabase build settings
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo "Missing NEXT_PUBLIC_SUPABASE_URL Actions secret"; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || { echo "Missing NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY Actions secret"; exit 1; }

      - name: Verify CONNECT Supabase project and email confirmation setting
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          project_ref="$(python -c 'import os, urllib.parse; print(urllib.parse.urlparse(os.environ["NEXT_PUBLIC_SUPABASE_URL"]).hostname.split(".")[0])')"
          test "$project_ref" = "kvigayczpzgvvfliyayi" || { echo "Wrong Supabase project in GitHub Actions secret: $project_ref"; exit 1; }
          settings="$(curl --fail --silent --show-error -H "apikey: $NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" "$NEXT_PUBLIC_SUPABASE_URL/auth/v1/settings")"
          auto_confirm="$(printf '%s' "$settings" | python -c 'import json,sys; print(str(json.load(sys.stdin).get("mailer_autoconfirm", False)).lower())')"
          echo "Supabase project ref: $project_ref"
          echo "Supabase email auto-confirm: $auto_confirm"
          test "$auto_confirm" = "true" || { echo "Turn off Confirm email for the CONNECT project's Email provider, then rerun this workflow."; exit 1; }

      - name: Type-check app
        run: npm run lint

      - name: Build web assets
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      - name: Generate Android project
        run: npx cap add android

      - name: Generate branded Android launcher icons
        run: java scripts/GenerateAndroidIcons.java android/app/src/main/res

      - name: Sync Capacitor assets
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CONNECT-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
